
name: Animal Vision CI

# Ejecutar cuando subimos cambios a GitHub
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ===================================
  # BACKEND - PYTHON / PYTEST
  # ===================================

  backend-tests:
    name: Backend - Pytest
    runs-on: ubuntu-latest

    # Credenciales ficticias para las pruebas simuladas.
    # No se realizan llamadas reales a AWS.
    env:
      AWS_ACCESS_KEY_ID: testing
      AWS_SECRET_ACCESS_KEY: testing
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Ejecutar pruebas Pytest
        run: |
          python -m pytest tests/ -v

  # ===================================
  # FRONTEND - REACT / VITE
  # ===================================

  frontend:
    name: Frontend - React
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependencias de React
        run: npm ci

      - name: Revisar codigo con ESLint
        run: npm run lint

      - name: Compilar React
        run: npm run build
