name: Animal Vision CI/CD

# ===================================
# EVENTOS QUE ACTIVAN EL PIPELINE
# ===================================

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ===================================
  # CI - BACKEND PYTHON / PYTEST
  # ===================================

  backend-tests:
    name: Backend - Pytest
    runs-on: ubuntu-latest

    # Credenciales ficticias para las pruebas.
    # No se realizan llamadas reales a AWS.
    env:
      AWS_ACCESS_KEY_ID: testing
      AWS_SECRET_ACCESS_KEY: testing
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
      ENABLE_CLOUDWATCH_METRICS: "false"

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Ejecutar pruebas Pytest
        run: |
          python -m pytest tests/ -v

  # ===================================
  # CI - FRONTEND REACT / VITE
  # ===================================

  frontend:
    name: Frontend - React
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependencias de React
        run: npm ci

      - name: Revisar codigo con ESLint
        run: npm run lint

      - name: Compilar React
        run: npm run build

  # ===================================
  # CD - DESPLIEGUE AUTOMATICO EN EC2
  # ===================================

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    # Requiere que CI termine correctamente
    needs: [backend-tests, frontend]

    # Solo desplegar al hacer push en main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    timeout-minutes: 35

    # Evitar despliegues simultaneos
    concurrency:
      group: animal-vision-production
      cancel-in-progress: false

    # Permisos para autenticacion OIDC
    permissions:
      id-token: write
      contents: read

    steps:

      # ===================================
      # 1. AUTENTICACION CON AWS
      # ===================================

      - name: Configurar credenciales AWS con OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Verificar identidad AWS
        run: |
          aws sts get-caller-identity

      # ===================================
      # 2. PREPARAR COMANDO PARA EC2
      # ===================================

      - name: Preparar comandos de despliegue
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re

          sha = os.environ["DEPLOY_SHA"]

          if not re.fullmatch(r"[0-9a-f]{40}", sha):
              raise ValueError("Commit SHA invalido")

          commands = [
              "set -eu",

              "echo '=== Actualizando Animal Vision ==='",

              "cd /opt/animal-vision",

              f"sudo -u ubuntu git fetch --no-tags --depth=1 origin {sha}",

              f"sudo -u ubuntu git -c advice.detachedHead=false checkout --force --detach {sha}",

              "echo '=== Configurando monitoreo CloudWatch ==='",

              "mkdir -p /etc/systemd/system/animal-vision.service.d",

              "printf '[Service]\\nEnvironment=\"ENABLE_CLOUDWATCH_METRICS=true\"\\n' > /etc/systemd/system/animal-vision.service.d/monitoring.conf",

              "systemctl daemon-reload",

              "echo '=== Ejecutando deploy.sh ==='",

              "bash scripts/deploy.sh",

              "echo '=== Verificando monitoreo CloudWatch ==='",

              "systemctl restart animal-vision",

              "systemctl is-active --quiet animal-vision",

              "systemctl show animal-vision --property=Environment --value | grep -q 'ENABLE_CLOUDWATCH_METRICS=true'",

              "curl --fail --retry 12 --retry-delay 3 --retry-connrefused http://127.0.0.1:8000/health",

              "echo '=== Monitoreo CloudWatch habilitado ==='"
          ]

          parameters = {
              "commands": commands,
              "executionTimeout": ["1800"]
          }

          with open("ssm-parameters.json", "w") as f:
              json.dump(parameters, f)
          PY

      # ===================================
      # 3. EJECUTAR DESPLIEGUE MEDIANTE SSM
      # ===================================

      - name: Enviar comando a EC2
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail

          test -n "$INSTANCE_ID"

          echo "Enviando despliegue a $INSTANCE_ID"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters file://ssm-parameters.json \
            --region us-east-1 \
            --comment "Animal Vision CD - GitHub Actions" \
            --query "Command.CommandId" \
            --output text)

          echo "COMMAND_ID=$COMMAND_ID" >> "$GITHUB_ENV"

          echo "Comando SSM: $COMMAND_ID"

      # ===================================
      # 4. VERIFICAR RESULTADO DEL CD
      # ===================================

      - name: Verificar despliegue
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail

          echo "Esperando resultado de SSM..."

          for i in $(seq 1 190); do

            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --region us-east-1 \
              --query "Status" \
              --output text 2>/dev/null) || STATUS="Pending"

            echo "Estado: $STATUS"

            if [ "$STATUS" = "Success" ]; then

              echo "=== LOG DEL DESPLIEGUE ==="

              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --region us-east-1 \
                --query "{Status:Status,Output:StandardOutputContent}" \
                --output json

              echo "=== CD COMPLETADO ==="

              exit 0
            fi

            case "$STATUS" in
              Failed|Cancelled|TimedOut|Undeliverable|Terminated)

                echo "=== ERROR EN DESPLIEGUE ==="

                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --region us-east-1 \
                  --query "{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}" \
                  --output json

                exit 1
                ;;
            esac

            sleep 10
          done

          echo "ERROR: Tiempo de espera agotado"
          exit 1
